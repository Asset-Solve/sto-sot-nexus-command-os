openapi: 3.1.0
info:
  title: Enterprise AI ERP API
  version: 0.1.0
  description: Canonical API contract for ERP-grade transactional web applications.
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/v1/lookups/{objectType}:
    get:
      summary: Connector-backed lookup
      parameters:
        - name: objectType
          in: path
          required: true
          schema:
            type: string
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: sourceMode
          in: query
          required: false
          schema:
            type: string
            enum: [SIMULATOR, SANDBOX, LIVE]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Lookup results with source, mode, freshness, and posting eligibility.
  /api/v1/transactions:
    post:
      summary: Create a transaction draft
      responses:
        "201":
          description: Draft transaction created.
  /api/v1/transactions/{transactionId}:
    get:
      summary: Get transaction detail
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction detail.
  /api/v1/transactions/{transactionId}/actions:
    post:
      summary: Execute workflow action
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Action result.
  /api/v1/transactions/{transactionId}/payload-preview:
    get:
      summary: Get payload preview before release
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payload preview.
  /api/v1/outbox/{outboxId}/replay-request:
    post:
      summary: Request approved replay of failed outbox item
      parameters:
        - name: outboxId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Replay approval requested.
  /api/v1/reconciliation/cases:
    get:
      summary: List reconciliation cases
      responses:
        "200":
          description: Reconciliation case list.
  /api/v1/ai/action-packages:
    post:
      summary: Create an AI-assisted recommendation or controlled action package
      responses:
        "202":
          description: AI action package created for review.

