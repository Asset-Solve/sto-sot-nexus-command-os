# Connector registry - each entry conforms to schemas/connector-definition.schema.json
# (Stage 09 gate validates every entry). Modes: SIMULATOR | SANDBOX | LIVE.
# currentMode defaults to SIMULATOR so a fresh build never writes to a live ERP.
# ERP posture: SAP S/4HANA primary (erpRole: primary), Oracle Fusion backup
# (erpRole: backup). Routing/failover rules:
# docs/integration/DUAL_ERP_ROUTING_AND_FAILOVER_POLICY.md
connectors:
  sap_s4hana:
    connectorId: sap_s4hana
    displayName: SAP S/4HANA (Cloud Public Edition default; Private Edition deltas per ADR)
    systemType: SAP
    erpRole: primary
    nativeIntegrationMethod: released_odata_api_via_btp_destination_and_cloud_connector
    cleanCoreLevel: A_released_apis_only # level C/D usage requires ADR
    apiCatalogRefs: ["https://hub.sap.com"] # verify release state per edition/release
    supportedBusinessObjects: [Equipment, FunctionalLocation, MaintenanceNotification, MaintenanceOrder, OperationConfirmation, WorkforceTimesheet, PurchaseRequisition, PurchaseOrder, GoodsMovement, ServiceEntrySheet, JournalEntry, BusinessPartner, Product, WBS, CostCenter, WarehouseTask]
    supportedActions: { read: true, create: true, update: conditional, post: true, reverse: true, statusReadBack: true, attachments: true, events: true }
    eventTopics: ["sap.s4.beh.*"] # CloudEvents notification pattern; read back full state via OData
    supportedModes: [SIMULATOR, SANDBOX, LIVE]
    currentMode: SIMULATOR
    authType: oauth2_saml_bearer
    destinationName: S4H_DEST
    cloudConnectorRequired: true # Private Edition/on-prem only; false for Public Edition
    requiresPayloadPreview: true
    requiresOutboxForWrites: true
    retryPolicy: { strategy: exponential_backoff, maxRetries: 5 }
    deadLetterPolicy: { enabled: true, store: outbox_dlq }
    owner: integration-platform-team
    healthStatus: unknown
  sap_integration_suite:
    connectorId: sap_integration_suite
    displayName: SAP Integration Suite (Cloud Integration / API Mgmt)
    systemType: SAP_MIDDLEWARE
    nativeIntegrationMethod: cloud_integration_iflow
    supportedBusinessObjects: []
    supportedActions: { orchestrate: true, map: true, route: true, retry: true, dlq: true, replay: true, monitor: true }
    supportedModes: [SANDBOX, LIVE]
    currentMode: SANDBOX
    authType: oauth2_client_credentials
    owner: integration-platform-team
    healthStatus: unknown
  sap_advanced_event_mesh:
    connectorId: sap_advanced_event_mesh
    displayName: SAP Integration Suite, advanced event mesh (AEM)
    systemType: SAP_EVENTING
    nativeIntegrationMethod: advanced_event_mesh_pub_sub_cloudevents
    supportedBusinessObjects: []
    supportedActions: { publish: true, subscribe: true, status_events: true, dynamic_topics: true }
    eventTopics: ["default/sap.s4/*/ce/sap/s4/beh/#"]
    supportedModes: [SANDBOX, LIVE]
    currentMode: SANDBOX
    authType: oauth2_client_credentials
    owner: integration-platform-team
    healthStatus: unknown
    notes: successor of SAP Event Mesh default plan (migration path SAP-supported)
  sap_edge_integration_cell:
    connectorId: sap_edge_integration_cell
    displayName: SAP Integration Suite - Edge Integration Cell
    systemType: SAP_MIDDLEWARE
    nativeIntegrationMethod: edge_integration_cell_hybrid_runtime
    supportedBusinessObjects: []
    supportedActions: { orchestrate: true, api_management: true, in_landscape_processing: true }
    supportedModes: [SANDBOX, LIVE]
    currentMode: SANDBOX
    authType: oauth2_client_credentials
    owner: integration-platform-team
    healthStatus: unknown
    notes: optional hybrid runtime for data-residency / in-landscape API and iFlow execution
  oracle_fusion:
    connectorId: oracle_fusion
    displayName: Oracle Fusion Cloud Applications (backup ERP)
    systemType: ORACLE
    erpRole: backup
    nativeIntegrationMethod: oracle_fusion_rest_api # /fscmRestApi/resources/latest; FBDI for volume
    apiCatalogRefs: ["https://docs.oracle.com/en/cloud/saas"]
    supportedBusinessObjects: [Financials, Procurement, SCM, HCM, Projects, Maintenance]
    supportedActions: { read: true, create: true, update: conditional, post: true, statusReadBack: true, batch_fbdi: true, events: true }
    supportedModes: [SIMULATOR, SANDBOX, LIVE]
    currentMode: SIMULATOR
    authType: oauth2_least_privilege
    requiresPayloadPreview: true
    requiresOutboxForWrites: true
    retryPolicy: { strategy: exponential_backoff, maxRetries: 5 }
    deadLetterPolicy: { enabled: true, store: parking_table }
    quarterlyUpdateRegression: required # re-validate mappings/auth every 26A-26D update
    owner: integration-platform-team
    healthStatus: unknown
  oracle_integration_cloud:
    connectorId: oracle_integration_cloud
    displayName: Oracle Integration Cloud (OIC)
    systemType: ORACLE_MIDDLEWARE
    nativeIntegrationMethod: oic_integration_flow
    supportedBusinessObjects: []
    supportedActions: { integrate: true, process_automation: true, adapters: true, approvals: true }
    supportedModes: [SANDBOX, LIVE]
    currentMode: SANDBOX
    authType: oauth2_client_credentials
    owner: integration-platform-team
    healthStatus: unknown
  maximo:
    connectorId: maximo
    displayName: IBM Maximo
    systemType: NON_SAP_EAM
    nativeIntegrationMethod: maximo_rest_oslc
    supportedBusinessObjects: [Asset, WorkOrder, ServiceRequest, Inventory]
    supportedActions: { read: true, create: true, update: true }
    supportedModes: [SIMULATOR, SANDBOX, LIVE]
    currentMode: SIMULATOR
    authType: api_key
    requiresOutboxForWrites: true
    owner: eam-integration-team
    healthStatus: unknown
  service_now:
    connectorId: service_now
    displayName: ServiceNow
    systemType: NON_SAP_ITSM
    nativeIntegrationMethod: servicenow_table_rest_api
    supportedBusinessObjects: [Incident, Change, Task, CMDB]
    supportedActions: { read: true, create: true, update: true }
    supportedModes: [SIMULATOR, SANDBOX, LIVE]
    currentMode: SIMULATOR
    authType: oauth2
    owner: itsm-integration-team
    healthStatus: unknown
  aveva_pi:
    connectorId: aveva_pi
    displayName: AVEVA PI (historian)
    systemType: OT_HISTORIAN
    nativeIntegrationMethod: pi_web_api
    supportedBusinessObjects: [PiPoint, PiTag, PiStream]
    supportedActions: { read: true, batch_read: true, stream: true, write: blocked_by_default }
    supportedModes: [SIMULATOR, SANDBOX, LIVE]
    currentMode: SIMULATOR
    authType: kerberos_or_bearer
    owner: ot-data-team
    healthStatus: unknown
  opc_ua:
    connectorId: opc_ua
    displayName: OPC UA (OT)
    systemType: OT_PROTOCOL
    nativeIntegrationMethod: opc_ua_client
    supportedBusinessObjects: [Node, Variable, Subscription]
    supportedActions: { read: true, subscribe: true, write: blocked_by_default }
    supportedModes: [SANDBOX, LIVE]
    currentMode: SANDBOX
    authType: x509_certificate
    owner: ot-data-team
    healthStatus: unknown

# Fallback policy (not a connector definition; governs generic access).
fallback_policy:
  generic_rest: allowed_only_if_native_unavailable_and_approved
  generic_sftp: allowed_for_batch_import_export_only
  direct_database_write: prohibited_for_systems_of_record

# Dual-ERP routing (not a connector definition; enforced by posting-path engine).
erp_routing_policy:
  primary: sap_s4hana
  backup: oracle_fusion
  routing_key: tenant_object_company # resolved via Source-of-Record Register
  dual_post: prohibited
  automatic_write_failover: prohibited # SoR change requires ADR + approval + reconciliation
  read_failover: replicated_read_model_with_staleness_badge
