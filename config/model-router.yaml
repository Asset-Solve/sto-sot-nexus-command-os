# Model IDs are examples — pin to the versions approved in your model registry.
# When running inside an SAP landscape, the generative AI hub (BTP AI Foundation)
# is an approved gateway/provider; embedded agent work should align with Joule
# Studio + AI Agent Hub governance rather than bypassing it.
model_profiles:
  architecture_reasoning:
    allowed_providers: [anthropic, openai, azure_openai, sap_genai_hub]
    default: anthropic:claude-opus-4-8
    requires_tools: true
  code_generation:
    allowed_providers: [anthropic, openai]
    default: anthropic:claude-sonnet-5
  repo_refactor:
    allowed_providers: [anthropic, openai, github_copilot]
    default: anthropic:claude-code
  summarization:
    allowed_providers: [anthropic, openai, local]
    default: anthropic:claude-haiku-4-5
  confidential_data:
    allowed_providers: [azure_openai, sap_genai_hub, private]
    default: azure_openai:approved-private-deployment
routing_rules:
  - when: data_classification in [restricted, regulated]
    require_provider_allowlist: true
    require_no_training_retention: true
    require_region_match: true
  - when: action_class in [controlled_side_effect, blocked_autonomous_action]
    require_human_approval: true
    block_autonomous_tool_calls: true
logging:
  record_model: true
  record_prompt_version: true
  record_tool_calls: true
  record_token_usage: true
  mask_sensitive_values: true
